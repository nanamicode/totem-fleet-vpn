# Cenário padrão deste projeto: ngrok (ou Cloudflare Tunnel) termina o HTTPS
# por fora, então aqui só roda o Headscale, exposto em localhost:8080 para o
# túnel. Se em vez disso você usar um VPS com IP público direto, adicione de
# volta um serviço de proxy HTTPS (ex.: Caddy) na frente — ver
# headscale/Caddyfile.example e docs/RUNBOOK.md.
services:
  headscale:
    image: headscale/headscale:0.23
    container_name: headscale
    restart: unless-stopped
    command: serve
    ports:
      - "127.0.0.1:8080:8080" # API/coordenação — só o túnel local acessa
      - "3478:3478/udp"        # STUN/DERP embutido (sem efeito atrás de
                                # ngrok/Cloudflare Tunnel; mantido para o
                                # cenário de VPS com IP público)
    volumes:
      - ./config:/etc/headscale
      - ./data:/var/lib/headscale
