# Cenário padrão deste projeto: acesso direto pelo IP público da sua própria
# rede (sem ngrok/Cloudflare/VPS de terceiros). O Caddy termina o HTTPS na
# frente do Headscale, usando um hostname sslip.io (gratuito, sem conta,
# resolve automaticamente para o seu IP público) — ver docs/RUNBOOK.md.
#
# Pré-requisito feito por você, uma vez, no painel do seu roteador: encaminhar
# as portas 80/tcp, 443/tcp e 3478/udp para o IP local desta máquina.
services:
  headscale:
    image: headscale/headscale:0.23
    container_name: headscale
    restart: unless-stopped
    command: serve
    expose:
      - "8080" # API/coordenação em HTTP puro — só o Caddy acessa
    ports:
      - "3478:3478/udp" # STUN/DERP embutido
    volumes:
      - ./config:/etc/headscale
      - ./data:/var/lib/headscale
    networks:
      - headscale

  caddy:
    image: caddy:2-alpine
    container_name: headscale-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - headscale
    depends_on:
      - headscale

networks:
  headscale:

volumes:
  caddy_data:
  caddy_config:
